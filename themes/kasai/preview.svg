<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Kasai theme preview</title>
  <desc id="desc">An orange, charcoal, and warm white manga catalog interface with a featured story, latest updates, and rankings.</desc>
  <defs>
