<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-label="Tankobon theme preview">
    <defs>
        <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8a2f22"/>
            <stop offset="1" stop-color="#c0483a"/>
        </linearGradient>
        <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3a2a18" flood-opacity="0.28"/>
        </filter>
    </defs>

    <rect width="1280" height="800" fill="#f6f1e7"/>

    <!-- header -->
    <rect x="0" y="0" width="1280" height="72" fill="#fffdf8"/>
    <rect x="0" y="71" width="1280" height="1" fill="#e4dccd"/>
    <rect x="64" y="22" width="30" height="30" rx="8" fill="#b23a2c"/>
    <text x="80" y="44" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">巻</text>
    <text x="108" y="45" font-family="Georgia, serif" font-size="20" font-weight="800" fill="#241d17">Meika-san</text>
    <text x="1064" y="45" font-family="sans-serif" font-size="14" font-weight="600" fill="#6d6357">Home</text>
    <text x="1136" y="45" font-family="sans-serif" font-size="14" font-weight="600" fill="#6d6357">Library</text>

    <!-- cover -->
    <g filter="url(#sh)">
        <rect x="64" y="128" width="300" height="420" rx="8" fill="url(#cover)"/>
        <rect x="64" y="128" width="8" height="420" rx="4" fill="#000" opacity="0.18"/>
    </g>
    <text x="214" y="360" font-family="Georgia, serif" font-size="120" font-weight="800" fill="#ffffff" fill-opacity="0.92" text-anchor="middle">冥</text>

    <!-- info -->
    <text x="400" y="150" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#b23a2c">NOW READING</text>
    <text x="400" y="205" font-family="Georgia, serif" font-size="46" font-weight="800" fill="#241d17">The Bound Volume</text>
    <text x="400" y="238" font-family="sans-serif" font-size="16" fill="#6d6357">by Koma Author · art by Koma Artist · 2026</text>

    <rect x="400" y="262" width="92" height="30" rx="15" fill="#fffefb" stroke="#e4dccd"/>
    <circle cx="418" cy="277" r="4" fill="#2fa36b"/>
    <text x="432" y="282" font-family="sans-serif" font-size="13" font-weight="700" fill="#6d6357">Ongoing</text>
    <rect x="502" y="262" width="86" height="30" rx="15" fill="#fffefb" stroke="#e4dccd"/>
    <text x="545" y="282" font-family="sans-serif" font-size="12" font-weight="600" fill="#6d6357" text-anchor="middle">Comedy</text>

    <rect x="400" y="312" width="220" height="46" rx="10" fill="#b23a2c"/>
    <text x="510" y="341" font-family="sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Start reading · Ch. 1</text>
    <rect x="632" y="312" width="150" height="46" rx="10" fill="none" stroke="#e4dccd"/>
    <text x="707" y="341" font-family="sans-serif" font-size="14" font-weight="700" fill="#241d17" text-anchor="middle">Latest · Ch. 5</text>

    <text x="400" y="392" font-family="sans-serif" font-size="15" fill="#241d17">A cover-forward single-series landing: one manga, the whole run,</text>
    <text x="400" y="414" font-family="sans-serif" font-size="15" fill="#241d17">and a full chapter list — styled like a hardcover volume.</text>

    <line x1="400" y1="452" x2="1000" y2="452" stroke="#e4dccd"/>
    <text x="400" y="486" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#241d17">5</text>
    <text x="400" y="506" font-family="sans-serif" font-size="11" fill="#9a8f80">CHAPTERS</text>
    <text x="520" y="486" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#241d17">Ongoing</text>
    <text x="520" y="506" font-family="sans-serif" font-size="11" fill="#9a8f80">STATUS</text>

    <!-- chapter list -->
    <text x="64" y="620" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#241d17">Chapters</text>
    <g font-family="sans-serif">
        <rect x="64" y="640" width="720" height="44" rx="10" fill="#fffefb" stroke="#efe8da"/>
        <text x="92" y="667" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#b23a2c">5</text>
        <text x="140" y="667" font-size="14" font-weight="600" fill="#241d17">The final page</text>
        <text x="760" y="667" font-size="12" fill="#9a8f80" text-anchor="end">14 pages · 2d ago</text>

        <rect x="64" y="692" width="720" height="44" rx="10" fill="#fffefb" stroke="#efe8da"/>
        <text x="92" y="719" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#b23a2c">4</text>
        <text x="140" y="719" font-size="14" font-weight="600" fill="#241d17">A quiet afternoon</text>
        <text x="760" y="719" font-size="12" fill="#9a8f80" text-anchor="end">12 pages · 1w ago</text>
    </g>

    <!-- aside -->
    <rect x="816" y="640" width="400" height="96" rx="12" fill="#fffefb" stroke="#e4dccd"/>
    <text x="840" y="670" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#241d17">About</text>
    <text x="840" y="696" font-family="sans-serif" font-size="12.5" fill="#6d6357">Everything a reader needs for one series,</text>
    <text x="840" y="714" font-family="sans-serif" font-size="12.5" fill="#6d6357">in one focused place.</text>
</svg>
