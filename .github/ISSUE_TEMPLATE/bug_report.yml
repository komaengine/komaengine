name: Bug report
description: Something in KomaEngine does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. If it could be a security problem, stop here and use the [private vulnerability report](https://github.com/komaengine/komaengine/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: KomaEngine version
      description: Shown under Admin → Updates, or in the VERSION file.
      placeholder: 1.0.1
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How is it installed?
      options:
        - Docker Compose
        - Shared hosting (release ZIP)
        - Local development
        - Other
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - MariaDB
        - MySQL
        - SQLite
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP version
      placeholder: "8.4"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or koma:doctor output
      description: Remove passwords, tokens, keys, and personal data before pasting.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This is not a security vulnerability.
          required: true
