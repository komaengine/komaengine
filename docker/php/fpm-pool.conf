[www]
; Let the app read container environment variables (DB_*, APP_*) from compose
clear_env = no

; Surface PHP worker output to the container log stream
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
