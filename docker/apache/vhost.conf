<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Hand PHP requests to PHP-FPM running in this container on port 9000
    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://127.0.0.1:9000"
    </FilesMatch>

    # Cache only explicitly public image assets. Manga pages and covers use
    # application-controlled /media routes with private no-store responses.
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/jpeg "access plus 7 days"
        ExpiresByType image/png "access plus 7 days"
        ExpiresByType image/webp "access plus 7 days"
    </IfModule>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
